stages:
  - build
  - test
  - sbom

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_TAG

default:
  tags:
    - flarenetwork
  artifacts:
    expire_in: 3 days

include:
  - component: gitlab.com/flarenetwork/ci-components-private/lgtm@2
  - component: gitlab.com/flarenetwork/ci-components-private/dependency-track@2
  - template: Jobs/Secret-Detection.latest.gitlab-ci.yml
  - component: gitlab.com/flarenetwork/ci-components-private/lint-dockerfile@2
  - component: gitlab.com/flarenetwork/ci-components-private/lint-shell@2
  - component: gitlab.com/flarenetwork/ci-components-private/lint-go@2
    inputs:
      go_version: "1.25.8"
      golangci_config_file: ".golangci.yml"

variables:
  GOLANG_VERSION: "1.25.8"
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.cache/go-cache
  COVERAGE_FILE: "coverage.out"
  COBERTURA_FILE: "coverage.xml"

build-xrpld:
  stage: build
  image: docker:24
  tags: []
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -f Dockerfile.xrpld-ci -t "$CI_REGISTRY_IMAGE/xrpld-ci:latest" .
    - docker push "$CI_REGISTRY_IMAGE/xrpld-ci:latest"

test:
  stage: test
  image: golang:${GOLANG_VERSION}
  needs: ["build-xrpld"]
  cache:
    - key:
        files:
          - go.sum
        prefix: go-mod
      paths:
        - ${GOPATH}/pkg/mod
        - ${GOPATH}/bin
    - key:
        files:
          - go.sum
        prefix: go-cache-${GOLANG_VERSION}
      paths:
        - ${GOCACHE}
  services:
    - name: $CI_REGISTRY_IMAGE/xrpld-ci:latest
      alias: xrpld
  variables:
    XRP_RPC_URL: http://xrpld:5005
  before_script:
    - mkdir -p ${GOPATH} ${GOCACHE}
    - export PATH="${GOPATH}/bin:${PATH}"
    - go install github.com/boumenot/gocover-cobertura@v1.4.0
  script:
    - go mod download
    - go test -coverpkg=./... -coverprofile=${COVERAGE_FILE} ./...
    - go tool cover -func=${COVERAGE_FILE}
    - gocover-cobertura < ${COVERAGE_FILE} > ${COBERTURA_FILE}
  artifacts:
    paths:
      - ${COVERAGE_FILE}
    reports:
      coverage_report:
        coverage_format: cobertura
        path: ${COBERTURA_FILE}
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
