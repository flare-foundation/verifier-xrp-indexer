variables:
  GOPATH: /go
  GOLANG_VERSION: "1.25.5"
  GOLINT_VERSION: "v2.7.2"
  COVERAGE_FILE: "coverage.out"
  COBERTURA_FILE: "coverage.xml"

.gocache:
  key: ${CI_COMMIT_REF_SLUG}
  policy: pull-push
  paths:
    - ${GOPATH}/pkg/mod
    - ${GOPATH}/bin

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'push'
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:
  stage: build
  image: golang:${GOLANG_VERSION}
  needs: []
  cache: !reference [.gocache]
  script:
    - go mod download
    - go build ./...

lint:
  stage: test
  needs: [build]
  image: golangci/golangci-lint:${GOLINT_VERSION}
  cache: !reference [.gocache]
  script:
    - ./gofmt_check.sh
    - golangci-lint run --timeout 5m0s

test:
  stage: test
  image: golang:${GOLANG_VERSION}
  needs: [build]
  cache: !reference [.gocache]
  before_script:
    - go install github.com/boumenot/gocover-cobertura@v1.4.0
  services:
    xrpld:
      image: xrpllabsofficial/xrpld:latest
      container_name: xrpld
      command: ["-a"]   # enable standalone mode
      ports:
        - "5005:5005"   # JSON-RPC
        - "6006:6006"   # WebSocket
      volumes:
        - ./data-standalone:/var/lib/rippled
        - ./rippled-standalone.cfg:/etc/opt/ripple/rippled.cfg:ro
      restart: unless-stopped
  variables:
    XRP_RPC_URL: http://xrpld:5005
  script:
    - go mod download
    - go test -coverpkg=./... -coverprofile=${COVERAGE_FILE} ./...
    - go tool cover -func=${COVERAGE_FILE}
    - gocover-cobertura < ${COVERAGE_FILE} > ${COBERTURA_FILE}
  artifacts:
    paths:
      - ${COVERAGE_FILE}
    reports:
      coverage_report:
        coverage_format: cobertura
        path: ${COBERTURA_FILE}
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
