[server]
port_rpc_admin_local
port_ws_public
[port_rpc_admin_local]
port = 5005
ip = 0.0.0.0
protocol = http
admin = 0.0.0.0
[port_ws_public]
port = 6006
ip = 0.0.0.0
protocol = ws
admin = 0.0.0.0
[node_db]
type = RocksDB
path = /var/lib/rippled/db/rocksdb
online_delete = 512
advisory_delete = 0
[node_size]
small
[standalone]
[peer_private]
1
[validation_quorum]
1
[rpc_startup]
{ "command": "log_level", "params": ["info"] }
[logging]
severity = warning
